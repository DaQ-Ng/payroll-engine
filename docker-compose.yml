services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payroll
      POSTGRES_USER: payroll
      POSTGRES_PASSWORD: payroll
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payroll"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - payroll-db-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: payroll
      DB_USER: payroll
      DB_PASSWORD: payroll
      APP_API_KEY: demo-local-key
    ports:
      - "8080:8080"

volumes:
  payroll-db-data:
