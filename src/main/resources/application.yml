spring:
  application:
    name: payroll-engine
  datasource:
    url: jdbc:h2:mem:payroll;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate must never auto-generate it
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  api-key: ${APP_API_KEY:demo-local-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
